<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120">
  <rect width="1280" height="1120" fill="#17191f"/>
  <text x="32" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">RÉGUA CHIBI — CANGAÇO ENCANTADO</text>
  <text x="32" y="72" fill="#b9c0ca" font-family="Arial, sans-serif" font-size="18">Folha 4 × 4 • 1024 × 1024 px • cada célula 256 × 256 px</text>
  <g transform="translate(0 96)">
    <defs>
      <pattern id="cellAnnotated" width="256" height="256" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="256" height="256" fill="#22262e" stroke="#00e5ff" stroke-width="2"/>
        <rect x="24" y="16" width="208" height="216" fill="#ffffff" fill-opacity="0.025" stroke="#ffd54a" stroke-width="1.5" stroke-dasharray="7 5"/>
        <line x1="128" y1="0" x2="128" y2="256" stroke="#54f2d2" stroke-width="1" stroke-dasharray="4 6"/>
        <line x1="0" y1="232" x2="256" y2="232" stroke="#ff4b55" stroke-width="2"/>
        <circle cx="128" cy="232" r="4" fill="#ff4b55" stroke="#ffffff" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1024" height="1024" fill="url(#cellAnnotated)"/>
    <rect x="1" y="1" width="1022" height="1022" fill="none" stroke="#00e5ff" stroke-width="2"/>
  </g>
  <g transform="translate(1052 120)" font-family="Arial, sans-serif">
    <text x="0" y="0" fill="#ffffff" font-size="20" font-weight="700">MEDIDAS</text>
    <text x="0" y="36" fill="#00e5ff" font-size="16">Célula</text>
    <text x="0" y="58" fill="#ffffff" font-size="18" font-weight="700">256 × 256 px</text>
    <text x="0" y="98" fill="#ffd54a" font-size="16">Área segura</text>
    <text x="0" y="120" fill="#ffffff" font-size="18" font-weight="700">208 × 216 px</text>
    <text x="0" y="160" fill="#54f2d2" font-size="16">Centro horizontal</text>
    <text x="0" y="182" fill="#ffffff" font-size="18" font-weight="700">X = 128</text>
    <text x="0" y="222" fill="#ff4b55" font-size="16">Baseline / pivô</text>
    <text x="0" y="244" fill="#ffffff" font-size="18" font-weight="700">Y = 232</text>
    <text x="0" y="300" fill="#b9c0ca" font-size="15">Margens:</text>
    <text x="0" y="324" fill="#ffffff" font-size="15">24 px laterais</text>
    <text x="0" y="346" fill="#ffffff" font-size="15">16 px no topo</text>
    <text x="0" y="368" fill="#ffffff" font-size="15">24 px abaixo</text>
    <text x="0" y="424" fill="#b9c0ca" font-size="15">Não deixe cabelo,</text>
    <text x="0" y="446" fill="#b9c0ca" font-size="15">arma, poeira ou sombra</text>
    <text x="0" y="468" fill="#b9c0ca" font-size="15">cruzarem o amarelo.</text>
    <text x="0" y="530" fill="#ffffff" font-size="18" font-weight="700">ORDEM 4 × 4</text>
    <text x="0" y="562" fill="#b9c0ca" font-size="15">Linha 1: idle</text>
    <text x="0" y="586" fill="#b9c0ca" font-size="15">Linha 2: corrida</text>
    <text x="0" y="610" fill="#b9c0ca" font-size="15">Linha 3: ataque</text>
    <text x="0" y="634" fill="#b9c0ca" font-size="15">Linha 4: dano/morte</text>
  </g>
</svg>
